<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
  <rect width="1200" height="560" fill="#f7f8fa"/>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #17202a; }
    .title { font-size: 30px; font-weight: 700; }
    .label { font-size: 22px; font-weight: 600; }
    .note { font-size: 18px; }
    .cradle { fill: #d9dee5; stroke: #34495e; stroke-width: 4; }
    .hole { fill: #ffffff; stroke: #2c3e50; stroke-width: 4; }
    .old-hole { fill: none; stroke: #d62728; stroke-width: 4; stroke-dasharray: 9 7; }
    .center { stroke: #1f77b4; stroke-width: 3; stroke-dasharray: 10 8; }
    .pair { stroke: #d62728; stroke-width: 3; stroke-dasharray: 10 8; }
    .arrow { stroke: #d62728; stroke-width: 4; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d62728"/>
    </marker>
  </defs>
  <text x="600" y="45" text-anchor="middle" class="title">D405 rear M3 hole alignment / 后部M3孔位修正</text>

  <text x="300" y="90" text-anchor="middle" class="label">Pinned Seeed STEP / Seeed源文件</text>
  <rect x="100" y="120" width="400" height="360" rx="45" class="cradle"/>
  <line x1="300" y1="110" x2="300" y2="500" class="center"/>
  <line x1="320" y1="110" x2="320" y2="500" class="pair"/>
  <circle cx="220" cy="300" r="32" class="hole"/>
  <circle cx="420" cy="300" r="32" class="hole"/>
  <text x="300" y="525" text-anchor="middle" class="note">cradle center X = 0.00146 mm</text>
  <text x="320" y="550" text-anchor="middle" class="note">hole-pair center X = 1.00146 mm</text>
  <line x1="300" y1="185" x2="320" y2="185" class="arrow"/>
  <text x="310" y="170" text-anchor="middle" class="note">+1.000 mm</text>

  <text x="900" y="90" text-anchor="middle" class="label">Corrected / 修正版</text>
  <rect x="700" y="120" width="400" height="360" rx="45" class="cradle"/>
  <line x1="900" y1="110" x2="900" y2="500" class="center"/>
  <line x1="900" y1="110" x2="900" y2="500" class="pair"/>
  <circle cx="820" cy="300" r="32" class="old-hole"/>
  <circle cx="1020" cy="300" r="32" class="old-hole"/>
  <circle cx="800" cy="300" r="36" class="hole"/>
  <circle cx="1000" cy="300" r="36" class="hole"/>
  <line x1="820" y1="235" x2="800" y2="235" class="arrow"/>
  <line x1="1020" y1="235" x2="1000" y2="235" class="arrow"/>
  <text x="910" y="215" text-anchor="middle" class="note">each hole moves −1.000 mm / 每颗孔左移1.000 mm</text>
  <text x="900" y="525" text-anchor="middle" class="note">20.000 mm spacing, centered on D405 body</text>
  <text x="900" y="550" text-anchor="middle" class="note">dashed = Seeed source; solid = corrected 3.6 / 6.0 mm holes</text>
</svg>
